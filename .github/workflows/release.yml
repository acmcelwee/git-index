name: Release

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with 'v'

permissions:
  contents: write # Needed to create the GitHub Release

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Build and Package Binaries
        run: |
          mkdir -p dist
          
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              export GOOS GOARCH
              binary_name="git-index-${GOOS}-${GOARCH}"
              
              echo "Building for $GOOS/$GOARCH..."
              go build -ldflags="-s -w -X 'github.com/acmcelwee/git-index/cmd.Version=${GITHUB_REF_NAME}'" -o "$binary_name" main.go
              
              echo "Packaging $binary_name..."
              tar -czvf "dist/${binary_name}.tar.gz" "$binary_name" README.md git-index.sh
            done
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
